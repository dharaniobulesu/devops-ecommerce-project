apiVersion: apps/v1
kind: Deployment

metadata:
  name: ecommerce-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ecommerce-app

  template:
    metadata:
      labels:
        app: ecommerce-app

    spec:
      containers:
        - name: ecommerce-app
          image: 269272823801.dkr.ecr.ap-south-1.amazonaws.com/ecommerce-app:v1
          ports:
            - containerPort: 5000
          resources:
            requests: 
              cpu: "100m"
              memory: "128Mi"
            limits: 
              cpu: "500m"
              memory: "256Mi"  
